name: Python tests

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
      - ci/pytest
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Non-integration tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download versioned test data and model
        run: |
          dvc pull \
            data/raw/dataset.csv.dvc \
            models/selected_model.json.dvc \
            models/deployment_metadata.json.dvc

      - name: Run tests without live Gemma
        run: python -m pytest tests/ -m "not integration" --strict-markers -v