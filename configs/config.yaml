data:
  path: "data/raw/dataset.csv"

preprocessing:
  hourly_tolerance: "5min"

forecast:
  horizon_hours: 24

split:
  train_size: 0.8
  gap_hours: 24

cross_validation:
  n_splits: 5
  gap_hours: 24

models:
  random_forest:
    n_estimators: 100
    random_state: 42
    n_jobs: -1

  xgboost:
    n_estimators: 100
    learning_rate: 0.05
    max_depth: 3
    random_state: 42
    n_jobs: -1

  mlp:
    hidden_layers: [64, 32]
    epochs: 100
    batch_size: 32
    patience: 10
    activation: relu
    optimizer: adam
    loss: mse
    metrics: [mae]
    validation_split: 0.2
    shuffle: true
    restore_best_weights: true
    monitor: val_loss
    min_delta: 0.0
    mode: auto

tuning:
  xgboost:
    n_estimators: [100, 200]
    learning_rate: [0.05, 0.1]
    max_depth: [3, 6]
